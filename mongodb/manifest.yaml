apiVersion: v1
kind: deployment
metadata: 
  name: mongodb
  namespace: roboshop
  labels: #replicaset labels
    project: roboshop
    component: mongodb
    tier: db
spec:
  replicas: 1
  selector: #these labels are used to select pods
    matchlabels: 
      project: roboshop
      component: mongodb
      tier: db
template:
  metadata: 
    labels: 
      project: roboshop
      component: mongodb
      tier: db
  spec: 
    containers:
    - name: mongodb
      image: akhila2829/mongodb:v1
      readinessprobe:
        tcpsocket:
          port: 27017
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessprobe:
        tcpsocket: 
          port: 27017
        initialDelayseconds: 5
        periodSeconds: 5   

---
apiVersion: v1 
kind: Service
metadata: 
  name: mongodb
  namespace: roboshop
spec: 
  selector: 
    project: roboshop
    component:  mongodb
    tier: db
  ports: 
  - protocol: TCP
    port: 27017 
    targetPort: 27017                   






  